# Runs the full test suite on Windows, macOS and Linux (Python 3.10 / 3.13) on every push / PR.
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Launcher check (creates the per-OS venv)
        run: python run.py --check
      - name: Tests (incl. spawn-based extraction)
        run: python run.py --test
        env:
          PYTHONWARNDEFAULTENCODING: "1"

  frontend:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
